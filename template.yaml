AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Simple Python Lambda API deployed via SAM

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues:
      - staging
      - production

Globals:
  Function:
    Timeout: 10
    Runtime: python3.12
    MemorySize: 128
    Layers:
      - !Sub arn:aws:lambda:${AWS::Region}:017000801446:layer:AWSLambdaPowertoolsPythonV3-python312-x86_64:7

Resources:
  HelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.lambda_handler
      CodeUri: src/
      Description: !Sub "Hello API - ${Environment}"
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          POWERTOOLS_SERVICE_NAME: kiro-github-actions-demo
          POWERTOOLS_LOG_LEVEL: INFO
      Events:
        Root:
          Type: Api
          Properties:
            Path: /
            Method: get
        Health:
          Type: Api
          Properties:
            Path: /health
            Method: get

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt HelloFunction.Arn
