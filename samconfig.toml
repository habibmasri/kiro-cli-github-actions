version = 0.1

[default.deploy.parameters]
stack_name = "kiro-github-actions-demo"
resolve_s3 = true
capabilities = "CAPABILITY_IAM"
region = "us-east-1"

[staging.deploy.parameters]
stack_name = "kiro-github-actions-demo-staging"
resolve_s3 = true
capabilities = "CAPABILITY_IAM"
region = "us-east-1"
parameter_overrides = "Environment=staging"

[production.deploy.parameters]
stack_name = "kiro-github-actions-demo-production"
resolve_s3 = true
capabilities = "CAPABILITY_IAM"
region = "us-east-1"
parameter_overrides = "Environment=production"
